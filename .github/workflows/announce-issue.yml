name: Announce new issue

# ECLab-News dispatches this event only after a newly generated issue and the
# updated manifest are publicly readable from the production CloudBase CDN.
on:
  repository_dispatch:
    types: [journal_issue_published]
  workflow_dispatch:
    inputs:
      label:
        description: "Issue label (YYYY-MM-DD_YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

env:
  JOURNAL_DATA_BASE: https://6563-eclab-progress-d9gm1x6ro276d951a-1341393791.tcb.qcloud.la/journal/v1

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify published issue
        id: issue
        env:
          LABEL: ${{ github.event.client_payload.label || inputs.label }}
        run: |
          set -euo pipefail
          if [[ ! "$LABEL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid issue label: $LABEL"
            exit 1
          fi

          ISSUE_FILE="$RUNNER_TEMP/$LABEL.json"
          MANIFEST_FILE="$RUNNER_TEMP/manifest.json"
          APP_FILE="$RUNNER_TEMP/journal-app.js"
          CACHE_BUSTER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --location --retry 3 \
            "https://zju-eclab.github.io/assets/app.js?announce=$CACHE_BUSTER" \
            --output "$APP_FILE"
          if ! grep --fixed-strings --quiet "$JOURNAL_DATA_BASE/" "$APP_FILE"; then
            echo "::error::The production journal frontend is not using CloudBase yet."
            exit 1
          fi

          READY=false
          for ATTEMPT in $(seq 1 6); do
            CACHE_BUSTER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}"
            if curl --fail --silent --show-error --retry 2 \
                 -H "Cache-Control: no-cache" \
                 "$JOURNAL_DATA_BASE/issues/$LABEL.json?announce=$CACHE_BUSTER" \
                 --output "$ISSUE_FILE" && \
               curl --fail --silent --show-error --retry 2 \
                 -H "Cache-Control: no-cache" \
                 "$JOURNAL_DATA_BASE/manifest.json?announce=$CACHE_BUSTER" \
                 --output "$MANIFEST_FILE"; then
              if python3 - "$ISSUE_FILE" "$MANIFEST_FILE" "$LABEL" <<'PY'
          import json
          import sys

          issue_path, manifest_path, expected_label = sys.argv[1:]
          with open(issue_path, encoding="utf-8") as f:
              issue = json.load(f)
          with open(manifest_path, encoding="utf-8") as f:
              manifest = json.load(f)

          if issue.get("label") != expected_label:
              raise SystemExit("Downloaded issue label does not match the dispatch payload")
          labels = {entry.get("label") for entry in manifest.get("issues", [])}
          if expected_label not in labels:
              raise SystemExit(1)
          PY
              then
                READY=true
                break
              fi
            fi
            echo "Published issue is not visible yet (attempt $ATTEMPT/6)."
            sleep 10
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Published manifest does not contain the dispatched issue."
            exit 1
          fi

          echo "file=$ISSUE_FILE" >> "$GITHUB_OUTPUT"

      - name: Notify DingTalk group
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          ISSUE_FILE: ${{ steps.issue.outputs.file }}
        run: |
          set -euo pipefail
          python3 scripts/notify_dingtalk.py \
            "$ISSUE_FILE" \
            "$DINGTALK_WEBHOOK_URL" \
            "$DINGTALK_SECRET"
