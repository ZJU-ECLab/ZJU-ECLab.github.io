name: Announce new issue

# ECLab-News dispatches this event only after a newly generated issue and the
# updated manifest are publicly readable from the production CloudBase CDN.
on:
  repository_dispatch:
    types: [journal_issue_published]
  workflow_dispatch:
    inputs:
      label:
        description: "Issue label (YYYY-MM-DD_YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read
  discussions: write

env:
  JOURNAL_DATA_BASE: https://6563-eclab-progress-d9gm1x6ro276d951a-1341393791.tcb.qcloud.la/journal/v1

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify published issue
        id: issue
        env:
          LABEL: ${{ github.event.client_payload.label || inputs.label }}
        run: |
          set -euo pipefail
          if [[ ! "$LABEL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid issue label: $LABEL"
            exit 1
          fi

          ISSUE_FILE="$RUNNER_TEMP/$LABEL.json"
          MANIFEST_FILE="$RUNNER_TEMP/manifest.json"
          APP_FILE="$RUNNER_TEMP/journal-app.js"
          CACHE_BUSTER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --retry 3 \
            "https://emotion.is-cool.dev/assets/app.js?announce=$CACHE_BUSTER" \
            --output "$APP_FILE"
          if ! grep --fixed-strings --quiet "$JOURNAL_DATA_BASE/" "$APP_FILE"; then
            echo "::error::The production journal frontend is not using CloudBase yet."
            exit 1
          fi

          READY=false
          for ATTEMPT in $(seq 1 6); do
            CACHE_BUSTER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}"
            if curl --fail --silent --show-error --retry 2 \
                 -H "Cache-Control: no-cache" \
                 "$JOURNAL_DATA_BASE/issues/$LABEL.json?announce=$CACHE_BUSTER" \
                 --output "$ISSUE_FILE" && \
               curl --fail --silent --show-error --retry 2 \
                 -H "Cache-Control: no-cache" \
                 "$JOURNAL_DATA_BASE/manifest.json?announce=$CACHE_BUSTER" \
                 --output "$MANIFEST_FILE"; then
              if python3 - "$ISSUE_FILE" "$MANIFEST_FILE" "$LABEL" <<'PY'
          import json
          import sys

          issue_path, manifest_path, expected_label = sys.argv[1:]
          with open(issue_path, encoding="utf-8") as f:
              issue = json.load(f)
          with open(manifest_path, encoding="utf-8") as f:
              manifest = json.load(f)

          if issue.get("label") != expected_label:
              raise SystemExit("Downloaded issue label does not match the dispatch payload")
          labels = {entry.get("label") for entry in manifest.get("issues", [])}
          if expected_label not in labels:
              raise SystemExit(1)
          PY
              then
                READY=true
                break
              fi
            fi
            echo "Published issue is not visible yet (attempt $ATTEMPT/6)."
            sleep 10
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Published manifest does not contain the dispatched issue."
            exit 1
          fi

          echo "file=$ISSUE_FILE" >> "$GITHUB_OUTPUT"

      - name: Resolve discussion category
        id: category
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # GraphQL variables must remain literal inside the query string.
          # shellcheck disable=SC2016
          RESP=$(gh api graphql -f query='
            query($owner:String!,$name:String!){
              repository(owner:$owner,name:$name){
                id
                discussionCategories(first:50){ nodes { id name } }
              }
            }' -F owner="$OWNER" -F name="$REPO")
          REPO_ID=$(echo "$RESP" | jq -r '.data.repository.id')
          CAT_ID=$(echo "$RESP" | jq -r '
            (.data.repository.discussionCategories.nodes
              | map(select(.name == "Announcements")) | .[0].id) // empty')
          if [[ -z "$CAT_ID" || "$CAT_ID" == "null" ]]; then
            CAT_ID=$(echo "$RESP" | jq -r '.data.repository.discussionCategories.nodes[0].id // empty')
          fi
          if [[ -z "$REPO_ID" || "$REPO_ID" == "null" ]]; then
            echo "::error::Could not resolve repository id. Are Discussions enabled?"
            exit 1
          fi
          if [[ -z "$CAT_ID" ]]; then
            echo "::error::No discussion categories found."
            exit 1
          fi
          echo "repo_id=$REPO_ID" >> "$GITHUB_OUTPUT"
          echo "category_id=$CAT_ID" >> "$GITHUB_OUTPUT"

      - name: Publish discussion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ steps.category.outputs.repo_id }}
          CATEGORY_ID: ${{ steps.category.outputs.category_id }}
          ISSUE_FILE: ${{ steps.issue.outputs.file }}
        run: |
          set -euo pipefail
          TITLE=$(python3 - "$ISSUE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              issue = json.load(f)
          title = issue.get("title") or issue.get("label") or "新一期已发布"
          print(f"{title} 已发布")
          PY
          )

          BODY=$(python3 - "$ISSUE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              issue = json.load(f)
          label = issue.get("label", "")
          title = issue.get("title") or label
          start = issue.get("start", "")
          end = issue.get("end", "")
          articles = issue.get("articles", []) or []
          count = issue.get("count", len(articles))
          recommended = sum(1 for article in articles if article.get("recommended"))
          lines = [f"**{title}** 已发布到在线版《东西情报》。", ""]
          if start and end:
              lines.append(f"- 时间范围：{start} – {end}")
          lines.append(f"- 收录文献：{count} 篇")
          if recommended:
              lines.append(f"- 推荐文献：{recommended} 篇")
          lines.extend([
              f"- 在线阅读：https://emotion.is-cool.dev/journal/#/issue/{label}",
              "",
              "欢迎关注本仓库的 Discussions 以接收后续每期更新通知。",
          ])
          print("\n".join(lines))
          PY
          )

          # GraphQL variables must remain literal inside the query string.
          # shellcheck disable=SC2016
          gh api graphql -f query='
            mutation($repoId:ID!,$categoryId:ID!,$title:String!,$body:String!){
              createDiscussion(input:{
                repositoryId:$repoId,
                categoryId:$categoryId,
                title:$title,
                body:$body
              }){ discussion { url } }
            }' \
            -F repoId="$REPO_ID" \
            -F categoryId="$CATEGORY_ID" \
            -F title="$TITLE" \
            -F body="$BODY" \
            --jq '.data.createDiscussion.discussion.url'

      - name: Notify DingTalk group
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          ISSUE_FILE: ${{ steps.issue.outputs.file }}
        run: |
          set -euo pipefail
          python3 scripts/notify_dingtalk.py \
            "$ISSUE_FILE" \
            "$DINGTALK_WEBHOOK_URL" \
            "$DINGTALK_SECRET"
