# Progress-board member roster.
#
# This file is intentionally SEPARATE from people.yml. The People page reflects
# the lab's current roster (people come and go), but progress-board membership
# must stay stable so historical projects keep their members even after someone
# leaves the People page. Derived once from people.yml; maintain it by hand.
#
# Fields:
#   id       stable slug used as the member id everywhere (URLs, D1 rows).
#            Keep it stable forever — changing it orphans existing project data.
#   name_zh  Chinese name (shown first when present).
#   name_en  English name.
#   group    grouping label (informational only).
#   leader   optional; exactly one member should be true. The Worker auto-adds
#            this member to every project and the UI cannot remove them.
#
# The build derives `label` as "name_zh / name_en". The lab mascot is excluded.
leader_id: xia-fang
