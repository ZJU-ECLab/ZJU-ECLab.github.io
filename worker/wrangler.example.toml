name = "eclab-progress-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Serve on the free *.workers.dev URL. Use this when the site domain is NOT a
# Cloudflare zone you control (e.g. a shared free subdomain like is-cool.dev).
# The static site calls this Worker cross-origin; CORS is handled in src/index.js.
workers_dev = true

# Lab leader auto-added to every project (member id = slug of name_en).
[vars]
LEADER_ID = "xia-fang"

# Copy this file to wrangler.toml and replace the database_id after creating D1.
[[d1_databases]]
binding = "DB"
database_name = "eclab-progress"
database_id = "replace-with-your-d1-database-id"

# ONLY if you actually control the site's domain as a Cloudflare zone, you can
# instead route the API path to this Worker and drop workers_dev:
# [[routes]]
# pattern = "yourdomain.example/api/progress*"
# zone_name = "yourdomain.example"
